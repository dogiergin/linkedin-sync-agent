name: LinkedIn Activity Sync Agent

on:
  schedule:
    # Runs every day at 09:00 UTC (12:00 TRT)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force webhook dispatch (bypass duplicate check)"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Scrape LinkedIn and Dispatch Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore Session or Set Cookie
        env:
          LINKEDIN_SESSION_JSON: ${{ secrets.LINKEDIN_SESSION_JSON }}
        run: |
          mkdir -p data
          python -c "import os; data = os.environ.get('LINKEDIN_SESSION_JSON'); open('data/session.json', 'w', encoding='utf-8').write(data) if data else None"

      - name: Run LinkedIn Sync Agent
        env:
          LINKEDIN_ACTIVITY_URL: ${{ secrets.LINKEDIN_ACTIVITY_URL || 'https://www.linkedin.com/in/dogukanergin/recent-activity/all/' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || 'https://dogukanergin.com/api/linkedin-webhook' }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          HEADLESS: "true"
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python main.py --force
          else
            python main.py --run-once
          fi

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            data/debug_screenshot.png
            data/debug_page.html
            logs/agent.log
          retention-days: 7
